[package]
name = "beatcraft"
version = "0.1.0"
edition = "2021"
description = "BeatCraft - pattern-based beat making: step sequencer, piano roll, playlist and mixer"
license = "MIT OR Apache-2.0"
authors = ["Mustafa Yusuf Yalçın", "<ARKADAŞ ADI SOYADI>"]
repository = "https://github.com/MustafaYusufYalcin/beatcraft"
build = "build.rs"

[[bin]]
name = "BeatCraft"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.33"
cpal = "0.16"
web-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.16", features = ["wasm-bindgen"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = false  # stripped by the packaging scripts (the bundled rust-objcopy is broken on some setups)

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
