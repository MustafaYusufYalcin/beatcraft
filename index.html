<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeatCraft</title>
  <link data-trunk rel="rust" data-bin="BeatCraft" data-wasm-opt="z" />
  <link data-trunk rel="icon" href="packaging/icon.png" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1f2427; }
    canvas { width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center;
               color: #c9d1d6; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="beatcraft"></canvas>
  <div id="loading">Loading BeatCraft… click anywhere once it opens to enable sound.</div>
</body>
</html>
