# Builds BeatCraft packages for Windows, macOS and Linux.
# Runs when you push a tag like v1.0.0 (and attaches the files to a GitHub release),
# or by hand from the Actions tab ("Run workflow").
name: Package BeatCraft

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          sudo apt-get install -y file desktop-file-utils

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./packaging/package-windows.ps1

      - name: Check the Windows package
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tmp = Join-Path $env:RUNNER_TEMP "beatcraft-check"
          Expand-Archive -Path "dist\beatcraft-$version-windows-x64-portable.zip" -DestinationPath $tmp -Force
          foreach ($f in "BeatCraft.exe", "beatcraft-cli.exe") {
            if (-not (Test-Path (Join-Path $tmp $f))) { throw "$f is missing from the zip root" }
          }
          & (Join-Path $tmp "beatcraft-cli.exe") list | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "beatcraft-cli.exe list failed" }
          $pv = (Get-Item (Join-Path $tmp "BeatCraft.exe")).VersionInfo.ProductVersion
          if ($pv -ne $version) { throw "ProductVersion $pv does not match $version" }

      - name: Package (macOS, Apple Silicon + Intel)
        if: matrix.name == 'macos'
        run: bash packaging/package-macos.sh --universal

      - name: Check the macOS package
        if: matrix.name == 'macos'
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test -f "dist/beatcraft-$VERSION-macos-universal.dmg"
          ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/BeatCraft.app/Contents/Info.plist)"
          test "$ID" = "io.github.mustafayusufyalcin.beatcraft"

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: bash packaging/package-linux.sh

      - name: Check the Linux packages
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          APP_ID=io.github.mustafayusufyalcin.beatcraft
          T="$(mktemp -d)"
          tar -xzf dist/beatcraft-*-linux-*.tar.gz -C "$T"
          for f in "$T"/*/bin/beatcraft "$T"/*/bin/beatcraft-cli; do
            test -f "$f" && test -x "$f"
          done
          "$T"/*/bin/beatcraft-cli list > /dev/null
          X="$(mktemp -d)"
          cp dist/beatcraft-*-linux-*.AppImage "$X/app.AppImage"
          (cd "$X" && ./app.AppImage --appimage-extract > /dev/null)
          test -f "$X/squashfs-root/AppRun"
          test -f "$X/squashfs-root/usr/bin/beatcraft"
          test -f "$X/squashfs-root/$APP_ID.desktop"
          desktop-file-validate "$X/squashfs-root/$APP_ID.desktop"

      - uses: actions/upload-artifact@v4
        with:
          name: BeatCraft-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS-*.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS-*.txt

  checksums:
    # One SHA256SUMS.txt for the whole release, the file the ArtCraft Launcher checks downloads against.
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - run: cat all/SHA256SUMS-*.txt | tr -d '\r' | sort -k2 > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
