# Builds BeatCraft packages for Windows, macOS and Linux.
# Runs when you push a tag like v1.0.0 (and attaches the files to a GitHub release),
# or by hand from the Actions tab ("Run workflow").
name: Package BeatCraft

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./packaging/package-windows.ps1

      - name: Package (macOS, Apple Silicon + Intel)
        if: matrix.name == 'macos'
        run: bash packaging/package-macos.sh --universal

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: bash packaging/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BeatCraft-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt

  checksums:
    # One SHA256SUMS.txt for the whole release, the file the ArtCraft Launcher checks downloads against.
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - run: cat all/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
